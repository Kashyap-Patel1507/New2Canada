<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Spell Check — New2Canada</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand"><span class="dot"></span> New2Canada</a>
        <nav class="nav-links">
            <a href="/apartments.html">Apartments</a>
            <a href="/jobs.html">Jobs</a>
            <a href="/banks.html">Banks</a>
            <a href="/mobile.html">Mobile</a>
            <a href="/scholarships.html">Scholarships</a>
            <a href="/history.html">History</a>
        </nav>
        <span id="authBox"></span>
    </header>

    <div id="demoBanner" class="banner" style="display:none;"></div>

    <main>
        <div class="page-head">
            <h2>Spell check ✏️</h2>
            <p>Levenshtein edit distance via Wagner-Fischer DP against an English dictionary live-augmented from every crawled page.</p>
        </div>

        <form class="search-bar" id="form" autocomplete="off">
            <input id="word" type="text" placeholder="Type a (possibly misspelled) word — e.g. torronto, stundent, aparment">
            <button type="submit">Check</button>
        </form>

        <div id="out"></div>
    </main>

    <footer>COMP 8547 · Advanced Computing Concepts · University of Windsor</footer>

    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/spellcheck.js"></script>
</body>
</html>
